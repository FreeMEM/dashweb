<!DOCTYPE html>
<html><head><title>Fondos</title>

<div class="caja" style="background-image:url(cuadro.iff)"><div class="texto">Otra caja</div></div>
<div class="mosaico"></div>
<p>Debajo de todo.</p>
</body></html>
