<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JavaScript</title>
<style>body{font-family:sans-serif;margin:8px} .js{color:#060} li.par{color:#900}</style></head><body>
<h1 id="titulo">Sin JavaScript</h1>
<p>Esta lista la hace un script:</p>
<ul id="lista"></ul>
<p class="js" id="pie"></p>
<script>
document.getElementById('titulo').textContent = 'Hecho con JavaScript';
var ul = document.getElementById('lista');
for (var i = 1; i <= 5; i++) {
  var li = document.createElement('li');
  li.textContent = 'Elemento ' + i + ' de 5';
  if (i % 2 == 0) li.className = 'par';
  ul.appendChild(li);
}
document.getElementById('pie').innerHTML = 'QuickJS ' + (typeof BigInt) + ', <b>' + document.querySelectorAll('li').length + '</b> elementos.';
</script>
</body></html>
